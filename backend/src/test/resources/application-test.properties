spring.application.name=financeiro-test

spring.datasource.url=jdbc:h2:mem:gestor_financeiro_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

jwt.secret=test_secret_key_muito_seguro_com_mais_de_32_bytes_1234567890
jwt.expiration=900000

server.port=0
cookie.secure=false

security.auth.max-failed-attempts=3
security.auth.lockout-minutes=1

logging.level.root=WARN
logging.level.com.gestor.financeiro=INFO
logging.level.org.springframework.security=INFO

# O perfil base fechou docs e detalhes de health (BACKLOG-0085); os testes de
# infraestrutura verificam justamente o comportamento com eles abertos, como em
# application-dev.properties.
app.docs.public=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Worker de fila desligado no perfil de teste: cada teste exercita o consumo
# explicitamente, sem thread de fundo competindo pelo H2.
app.jobs.worker.enabled=false

# Agendador de notificações desligado no teste: cada teste enfileira o que quer exercitar.
app.notificacoes.scheduler.enabled=false
app.orcamento.fechamento.enabled=false
app.recorrencia.deteccao.enabled=false
