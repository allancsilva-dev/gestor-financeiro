# Nunca ativado implicitamente. Profile exclusivo do runner E2E local.
assistant.text.enabled=true
assistant.audio.enabled=true
assistant.whatsapp.enabled=false
assistant.external.enabled=true
assistant.external.billing-confirmed=false
assistant.external.data-policy-accepted=false
assistant.whatsapp.worker.enabled=false

# Evita ruído e vazamento de payloads nos artefatos locais.
spring.jpa.show-sql=false
logging.level.com.gestor.financeiro=INFO
logging.level.org.springframework.security=WARN
