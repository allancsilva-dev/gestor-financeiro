# Nunca ativado implicitamente. Profile exclusivo do runner E2E local.
assistant.text.enabled=true
assistant.audio.enabled=true
assistant.whatsapp.enabled=false
assistant.external.enabled=true
assistant.external.billing-confirmed=false
assistant.external.data-policy-accepted=false
assistant.whatsapp.worker.enabled=false

# Conector regulado sobre o provedor fake: nenhum dado bancario real, nenhuma chamada de rede.
# A chave e de teste e vale so aqui; producao exige as variaveis de ambiente reais e o guard
# derruba o boot sem elas.
openfinance.enabled=true
openfinance.provider=FAKE
openfinance.data-policy-accepted=true
openfinance.encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
openfinance.key-version=v1
openfinance.hmac-secret=local-e2e-hmac
openfinance.oauth.redirect-uri=https://localhost/openfinance/callback

# Evita ruído e vazamento de payloads nos artefatos locais.
spring.jpa.show-sql=false
logging.level.com.gestor.financeiro=INFO
logging.level.org.springframework.security=WARN
