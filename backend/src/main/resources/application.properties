spring.application.name=financeiro
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# ==========================================
# BANCO DE DADOS (obrigatorio em todos os perfis da aplicacao)
# ==========================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Contract V41 (PR-F2-19): payload com propriedade desconhecida (ex.: contaId,
# objeto conta) falha com 400 em vez de ser interpretado silenciosamente.
spring.jackson.deserialization.fail-on-unknown-properties=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Default seguro: SQL em log so onde o perfil pedir (application-dev). BACKLOG-0085.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================
# JWT SEGURANÇA
# ==========================================
# Sem default: obriga JWT_SECRET via ambiente.
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
# Janela do refresh token, em dias. Desliza a cada rotação: uso regular do
# app mantém a sessão viva sem pedir senha de novo.
jwt.refresh-expiration-days=30

# ==========================================
# SERVIDOR
# ==========================================
server.port=8081
cookie.secure=${COOKIE_SECURE:true}
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:50}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:5}
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:5s}

# Envelope seguro e ajustável. Pool pequeno evita que cada réplica esgote PostgreSQL.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:2000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# Swagger/OpenAPI fechado por default; application-dev reabre (BACKLOG-0085).
app.docs.public=false

# Exposição mínima de observabilidade para mobile/web e monitoramento básico.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.status.http-mapping.degraded=200
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503
management.endpoint.health.status.order=down,out-of-service,degraded,up,unknown

# Reconciliação global read-only (PR-F2-20)
app.reconciliation.scheduler.enabled=true
app.reconciliation.scheduler.cron=0 30 0 * * *
app.reconciliation.batch-size=200

# ==========================================
# CORS (Produção - Domínio específico)
# ==========================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:}

# ==========================================
# SEGURANÇA — BRUTE FORCE PROTECTION
# ==========================================
security.auth.max-failed-attempts=5
security.auth.lockout-minutes=15

# LGPD: versão da política de privacidade registrada no consentimento do cadastro
app.politica.versao=2026-07

# Timezone de negócio (ADR-0003): datas financeiras e scheduler calculam neste fuso
app.business.timezone=${APP_BUSINESS_TIMEZONE:America/Sao_Paulo}
app.import.limits.file-bytes=${APP_IMPORT_FILE_BYTES:10485760}
app.import.limits.detection-bytes=${APP_IMPORT_DETECTION_BYTES:65536}
app.import.limits.records=${APP_IMPORT_RECORDS:50000}
app.import.limits.record-chars=${APP_IMPORT_RECORD_CHARS:65536}
app.import.limits.field-chars=${APP_IMPORT_FIELD_CHARS:8192}
app.import.limits.csv-columns=${APP_IMPORT_CSV_COLUMNS:64}
app.import.limits.ofx-depth=${APP_IMPORT_OFX_DEPTH:32}
app.import.limits.ofx-elements=${APP_IMPORT_OFX_ELEMENTS:500000}
app.import.limits.ofx-header-bytes=${APP_IMPORT_OFX_HEADER_BYTES:8192}
app.import.limits.staging-flush=${APP_IMPORT_STAGING_FLUSH:250}

# ==========================================
# UPLOAD
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.location=${MULTIPART_LOCATION:${java.io.tmpdir}}
app.upload.dir=uploads
# Fluxo antigo grava direto no ledger, sem preview/reversão. Fail-closed.
app.import.legacy-write-enabled=${LEGACY_IMPORT_WRITE_ENABLED:false}

# ==========================================
# LOGS (Produção: reduzir verbosidade)
# ==========================================
logging.level.root=INFO
logging.level.com.gestor.financeiro=INFO
logging.level.org.springframework.security=WARN
