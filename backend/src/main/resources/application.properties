spring.application.name=financeiro
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# ==========================================
# BANCO DE DADOS (obrigatorio em todos os perfis da aplicacao)
# ==========================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Contract V41 (PR-F2-19): payload com propriedade desconhecida (ex.: contaId,
# objeto conta) falha com 400 em vez de ser interpretado silenciosamente.
spring.jackson.deserialization.fail-on-unknown-properties=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Default seguro: SQL em log so onde o perfil pedir (application-dev). BACKLOG-0085.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================
# JWT SEGURANÇA
# ==========================================
# Sem default: obriga JWT_SECRET via ambiente.
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
# Janela do refresh token, em dias. Desliza a cada rotação: uso regular do
# app mantém a sessão viva sem pedir senha de novo.
jwt.refresh-expiration-days=30

# ==========================================
# SERVIDOR
# ==========================================
server.port=8081
cookie.secure=${COOKIE_SECURE:true}

# Swagger/OpenAPI fechado por default; application-dev reabre (BACKLOG-0085).
app.docs.public=false

# Exposição mínima de observabilidade para mobile/web e monitoramento básico.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.status.http-mapping.degraded=200
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503
management.endpoint.health.status.order=down,out-of-service,degraded,up,unknown

# Reconciliação global read-only (PR-F2-20)
app.reconciliation.scheduler.enabled=true
app.reconciliation.scheduler.cron=0 30 0 * * *
app.reconciliation.batch-size=200

# ==========================================
# CORS (Produção - Domínio específico)
# ==========================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:}

# ==========================================
# SEGURANÇA — BRUTE FORCE PROTECTION
# ==========================================
security.auth.max-failed-attempts=5
security.auth.lockout-minutes=15

# LGPD: versão da política de privacidade registrada no consentimento do cadastro
app.politica.versao=2026-07

# Timezone de negócio (ADR-0003): datas financeiras e scheduler calculam neste fuso
app.business.timezone=${APP_BUSINESS_TIMEZONE:America/Sao_Paulo}

# ==========================================
# UPLOAD
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ==========================================
# LOGS (Produção: reduzir verbosidade)
# ==========================================
logging.level.root=INFO
logging.level.com.gestor.financeiro=INFO
logging.level.org.springframework.security=WARN
