spring.application.name=financeiro
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# ==========================================
# BANCO DE DADOS (obrigatorio em todos os perfis da aplicacao)
# ==========================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Contract V41 (PR-F2-19): payload com propriedade desconhecida (ex.: contaId,
# objeto conta) falha com 400 em vez de ser interpretado silenciosamente.
spring.jackson.deserialization.fail-on-unknown-properties=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Default seguro: SQL em log so onde o perfil pedir (application-dev). BACKLOG-0085.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Escrita em lote (staging de importação, backfill): sem batch cada linha vira um
# round-trip e a transação segura a conexão do pool por muito mais tempo.
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_JDBC_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================
# JWT SEGURANÇA
# ==========================================
# Sem default: obriga JWT_SECRET via ambiente.
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
# Janela do refresh token, em dias. Desliza a cada rotação: uso regular do
# app mantém a sessão viva sem pedir senha de novo.
jwt.refresh-expiration-days=30

# ==========================================
# SERVIDOR
# ==========================================
server.port=8081
cookie.secure=${COOKIE_SECURE:true}
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:50}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:5}
# Handshake curto contra conexão ociosa; upload de arquivo grande em rede lenta
# precisa de janela maior, por isso o timeout de leitura do corpo é separado.
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:5s}
server.tomcat.keep-alive-timeout=${SERVER_KEEP_ALIVE_TIMEOUT:20s}
# Sem swallow-size, um 413 no meio do upload aborta a conexão em vez de drenar o
# corpo, e o cliente recebe erro de rede em vez do status.
server.tomcat.max-swallow-size=${SERVER_MAX_SWALLOW_SIZE:12MB}
server.tomcat.max-http-form-post-size=${SERVER_MAX_FORM_POST_SIZE:2MB}

# Envelope seguro e ajustável. Pool pequeno evita que cada réplica esgote PostgreSQL.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:2000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# Swagger/OpenAPI fechado por default; application-dev reabre (BACKLOG-0085).
app.docs.public=false

# Exposição mínima de observabilidade para mobile/web e monitoramento básico.
# Métricas (app.import.batch.*) ficam fora por padrão: BACKLOG-0074 ainda trata do
# endurecimento do actuator. Para coletar, opte por ACTUATOR_EXPOSURE=health,info,metrics
# — a rota exige autenticação (SecurityConfig) e o nginx só publica /actuator/health.
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:health,info}
management.endpoint.health.show-details=never
management.endpoint.health.status.http-mapping.degraded=200
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503
management.endpoint.health.status.order=down,out-of-service,degraded,up,unknown

# Reconciliação global read-only (PR-F2-20)
app.reconciliation.scheduler.enabled=true
app.reconciliation.scheduler.cron=0 30 0 * * *
app.reconciliation.batch-size=200

# ==========================================
# CORS (Produção - Domínio específico)
# ==========================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:}

# ==========================================
# SEGURANÇA — BRUTE FORCE PROTECTION
# ==========================================
security.auth.max-failed-attempts=5
security.auth.lockout-minutes=15

# LGPD: versão da política de privacidade registrada no consentimento do cadastro
app.politica.versao=2026-07

# Timezone de negócio (ADR-0003): datas financeiras e scheduler calculam neste fuso
app.business.timezone=${APP_BUSINESS_TIMEZONE:America/Sao_Paulo}
app.import.limits.file-bytes=${APP_IMPORT_FILE_BYTES:10485760}
app.import.limits.detection-bytes=${APP_IMPORT_DETECTION_BYTES:65536}
app.import.limits.records=${APP_IMPORT_RECORDS:50000}
app.import.limits.record-chars=${APP_IMPORT_RECORD_CHARS:65536}
app.import.limits.field-chars=${APP_IMPORT_FIELD_CHARS:8192}
app.import.limits.csv-columns=${APP_IMPORT_CSV_COLUMNS:64}
app.import.limits.ofx-depth=${APP_IMPORT_OFX_DEPTH:32}
app.import.limits.ofx-elements=${APP_IMPORT_OFX_ELEMENTS:500000}
app.import.limits.ofx-header-bytes=${APP_IMPORT_OFX_HEADER_BYTES:8192}
app.import.limits.staging-flush=${APP_IMPORT_STAGING_FLUSH:250}
# Admissão do upload: protege memória e pool. O teto de parses simultâneos é o que
# impede que N uploads concorrentes estourem o heap e matem o processo inteiro.
app.import.admission.per-user-limit=${APP_IMPORT_PER_USER_LIMIT:10}
app.import.admission.window-seconds=${APP_IMPORT_WINDOW_SECONDS:60}
app.import.admission.max-in-flight-per-user=${APP_IMPORT_MAX_IN_FLIGHT:2}
app.import.admission.in-flight-window-minutes=${APP_IMPORT_IN_FLIGHT_WINDOW_MINUTES:15}
app.import.admission.max-concurrent-parses=${APP_IMPORT_MAX_CONCURRENT_PARSES:2}

# ==========================================
# FILA DURÁVEL (background_jobs)
# ==========================================
# Executor próprio, fora do TaskScheduler (pool 1) que já hospeda recorrências e
# reconciliação. Concorrência baixa porque o pool de conexões é pequeno e as threads
# HTTP disputam as mesmas conexões.
app.jobs.worker.enabled=${JOBS_WORKER_ENABLED:true}
app.jobs.worker.concurrency=${JOBS_WORKER_CONCURRENCY:2}
app.jobs.worker.idle-poll-seconds=${JOBS_WORKER_IDLE_POLL_SECONDS:5}
app.jobs.worker.lease-seconds=${JOBS_WORKER_LEASE_SECONDS:120}
app.jobs.worker.retry-backoff-seconds=${JOBS_WORKER_RETRY_BACKOFF_SECONDS:60}

# ==========================================
# NOTIFICAÇÕES
# ==========================================
# O cron só enfileira um job por titular; quem deriva os avisos é o worker.
app.notificacoes.scheduler.enabled=${NOTIFICACOES_SCHEDULER_ENABLED:true}
app.notificacoes.scheduler.cron=${NOTIFICACOES_SCHEDULER_CRON:0 0 7 * * *}
app.notificacoes.batch-size=${NOTIFICACOES_BATCH_SIZE:200}
# Push desligado por padrão: sem configuração explícita o app não fala com serviço externo.
app.notificacoes.push.enabled=${NOTIFICACOES_PUSH_ENABLED:false}
app.notificacoes.push.url=${NOTIFICACOES_PUSH_URL:https://exp.host/--/api/v2/push/send}
app.notificacoes.push.timeout-seconds=${NOTIFICACOES_PUSH_TIMEOUT:10}

# ==========================================
# ORÇAMENTO
# ==========================================
# Fechamento da competência anterior; roda todo dia porque instância parada na virada
# não pode deixar o mês sem fechar.
app.orcamento.fechamento.enabled=${ORCAMENTO_FECHAMENTO_ENABLED:true}
app.orcamento.fechamento.cron=${ORCAMENTO_FECHAMENTO_CRON:0 20 1 * * *}
app.orcamento.fechamento.batch-size=${ORCAMENTO_FECHAMENTO_BATCH_SIZE:200}

# ==========================================
# UPLOAD
# ==========================================
# Teto do arquivo. O nginx precisa aceitar acima disto (envelope multipart), senão
# o 413 vem do proxy e o cliente não recebe o erro de domínio.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:11MB}
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.location=${MULTIPART_LOCATION:${java.io.tmpdir}}
app.upload.dir=uploads
# Fluxo antigo grava direto no ledger, sem preview/reversão. Fail-closed.
app.import.legacy-write-enabled=${LEGACY_IMPORT_WRITE_ENABLED:false}

# ==========================================
# LOGS (Produção: reduzir verbosidade)
# ==========================================
logging.level.root=INFO
logging.level.com.gestor.financeiro=INFO
logging.level.org.springframework.security=WARN
