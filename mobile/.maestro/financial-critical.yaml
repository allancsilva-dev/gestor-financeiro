appId: com.gestorfinanceiro.mobile
name: Financial critical (local disposable environment)
tags:
  - financial-critical
---
- launchApp:
    clearState: true

# Registro descartavel em 3 passos (identidade, senha, consentimento LGPD)
- tapOn: ".*Criar conta"
- tapOn:
    id: "register-name"
- inputText: "Smoke Financeiro"
- pressKey: Enter
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "register-continuar"
- tapOn:
    id: "register-password"
- waitForAnimationToEnd
- inputText: ${E2E_PASSWORD}
# Enter salta para a confirmação (onSubmitEditing): tocar no campo com o teclado
# aberto é impreciso porque o layout sobe.
- pressKey: Enter
- inputText: ${E2E_PASSWORD}
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible: "Seus dados, suas regras"
- tapOn: "Aceito a política de privacidade"
- tapOn:
    id: "register-submit"
- extendedWaitUntil:
    visible: "Sua conta principal"
    timeout: 20000

# Onboarding em etapas: conta principal com 1.000 e o resto pulado
- assertVisible: "Sua conta principal"
- tapOn:
    id: "onboarding-account-balance"
- inputText: "100000"
- tapOn:
    id: "onboarding-continuar"
- assertVisible: "Sua renda mensal"
- tapOn:
    id: "onboarding-pular"
- assertVisible: "Categorias de gasto"
- tapOn:
    id: "onboarding-pular"
- assertVisible: "Cartão de crédito"
- tapOn:
    id: "onboarding-pular"
- assertVisible: "Uma meta para começar"
- tapOn:
    id: "onboarding-pular"
- assertVisible: "Tudo pronto?"
- tapOn:
    id: "onboarding-concluir"
- extendedWaitUntil:
    visible: "Saldo Disponível"
    timeout: 20000
- takeScreenshot: "01-onboarding-completo"

# Setup pos-onboarding pelas telas: cartao, categoria e meta (nao criados no onboarding minimo)
- tapOn:
    point: "89%,92%"
- scrollUntilVisible:
    element:
      text: "Categorias"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "Categorias"
- waitForAnimationToEnd
- tapOn: "Nova categoria"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "category-name"
    timeout: 10000
- tapOn:
    id: "category-name"
- inputText: "Alimentação"
- tapOn:
    point: "50%,4%"
- tapOn: "Salvar"
- extendedWaitUntil:
    visible: "Alimentação"
    timeout: 15000
- tapOn: "Voltar"
# A home remonta ao voltar: o botão Carteira só existe depois de /v1/home
- extendedWaitUntil:
    visible: "Carteira"
    timeout: 15000
- tapOn: "Carteira"
# A ação do header virou botão circular com rótulo próprio (ui/CabecalhoDeTela);
# na carteira vazia o mesmo rótulo aparece no botão do estado vazio, e os dois
# abrem o mesmo formulário.
- tapOn: "Cadastrar cartão"
- tapOn:
    id: "card-name"
- inputText: "Cartão Principal"
# O formulário encadeia foco pelo teclado (nome → banco → limite → dígitos →
# fechamento → vencimento); tocar campo a campo com o teclado aberto erra o alvo.
- pressKey: Enter
- pressKey: Enter
- inputText: "500000"
- pressKey: Enter
- pressKey: Enter
# Fechamento no fim do mês, não no dia 5: a competência de uma compra é o mês
# seguinte quando o dia da compra passa do fechamento (FaturaDatas.competencia).
# Com fechamento 5, a compra de hoje só caía na "fatura atual" quando o flow
# rodava até o dia 5 — nos outros dias a fatura vinha zerada e a asserção de
# 75,00 falhava. 31 é clampado ao último dia do mês, então nenhuma compra do
# mês corrente escapa da competência atual, em qualquer data de execução.
- inputText: "31"
- pressKey: Enter
- inputText: "12"
- tapOn:
    point: "50%,4%"
- waitForAnimationToEnd
- tapOn: "Salvar"
- extendedWaitUntil:
    visible: "Cartão Principal"
    timeout: 15000
- tapOn:
    point: "70%,92%"
- tapOn: "Criar meta"
- tapOn: "Cofre real.*"
- tapOn:
    id: "goal-name"
- inputText: "Meta Smoke"
- pressKey: Enter
- inputText: "100000"
- tapOn:
    point: "50%,4%"
- tapOn: "Salvar"
- waitForAnimationToEnd
# O card da meta é composto: o rótulo do nó funde nome, percentual e valores,
# e o Maestro casa regex por igualdade total.
- extendedWaitUntil:
    visible: ".*Meta Smoke.*"
    timeout: 30000
- tapOn:
    point: "10%,92%"

# Despesa de R$ 100 na conta principal
- tapOn: "Nova transação"
- assertVisible: "Nova Transação"
- tapOn:
    id: "transaction-value"
- inputText: "10000"
- pressKey: Enter
- inputText: "Despesa smoke"
- pressKey: Enter
- eraseText
- inputText: ${E2E_DATE_INPUT}
- tapOn:
    point: "50%,4%"
# O header do modal fica fora do ScrollView: tocar nele não fecha o teclado, e o
# teclado cobre os chips de categoria. Tocar um rótulo de dentro fecha.
- tapOn: "Categoria"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: ".*Alimentação"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: ".*Alimentação"
- waitForAnimationToEnd
- assertVisible: "Conta Principal"
- tapOn: "Salvar"
# O modal precisa fechar: enquanto ele está aberto, "Despesa smoke" e o valor
# aparecem nos próprios campos e a asserção passa sem a transação existir. O
# alvo é o campo de valor, que só existe no modal — "Nova Transação" também é o
# botão da home.
- extendedWaitUntil:
    notVisible:
      id: "transaction-value"
    timeout: 15000
- extendedWaitUntil:
    visible: "Despesa smoke"
    timeout: 15000
- assertVisible: ".*100,00"
- tapOn:
    point: "10%,92%"
- scrollUntilVisible:
    element:
      text: "Despesa smoke"
    direction: DOWN
- takeScreenshot: "02-despesa-dashboard"

# Compra de R$ 75 no cartao
- tapOn: "Nova transação"
- tapOn:
    id: "transaction-value"
- inputText: "7500"
- pressKey: Enter
- inputText: "Compra cartão smoke"
- pressKey: Enter
- eraseText
- inputText: ${E2E_DATE_INPUT}
- tapOn:
    point: "50%,4%"
# O header do modal fica fora do ScrollView: tocar nele não fecha o teclado, e o
# teclado cobre os chips de categoria. Tocar um rótulo de dentro fecha.
- tapOn: "Categoria"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: ".*Alimentação"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: ".*Alimentação"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Cartão"
    direction: DOWN
- tapOn: "Cartão"
- assertVisible: "Cartão Principal"
- tapOn: "Salvar"
- extendedWaitUntil:
    notVisible:
      id: "transaction-value"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Compra cartão smoke"
    direction: DOWN

# Fatura: lancamento 75, pagamento parcial 25 e restante 50
- tapOn:
    point: "89%,92%"
- tapOn: "Carteira"
- extendedWaitUntil:
    visible: "Carteira"
    timeout: 15000
- assertVisible: "Em aberto"
# A fatura virou tela propria (more/fatura): a linha do carrossel abre o detalhe
- tapOn: ".*Fatura atual.*"
- extendedWaitUntil:
    visible: "Lançamentos"
    timeout: 15000
- assertVisible: ".*75,00"
- scrollUntilVisible:
    element:
      text: "Compra cartão smoke"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Valor do pagamento"
    direction: UP
- tapOn:
    id: "invoice-payment-value"
- eraseText
- inputText: "2500"
- tapOn:
    point: "50%,4%"
- tapOn: "Pagar Fatura"
- extendedWaitUntil:
    visible: ".*Restante:.*50,00"
    timeout: 15000
# Pago e restante moram no MESMO nó ("Pago: R$ 25,00 · Restante: R$ 50,00") e o
# Maestro casa regex por igualdade total: sem o `.*` final a expressão exigiria
# que o texto terminasse em 25,00, e ele termina em 50,00.
- assertVisible: ".*Pago:.*25,00.*"
- takeScreenshot: "03-fatura-parcial"

# Reserva de R$ 50 na meta e verificacao do cofre
- tapOn:
    point: "70%,92%"
- extendedWaitUntil:
    visible: ".*Meta Smoke.*"
    timeout: 15000
- tapOn: "Depositar"
- assertVisible: "Adicionar Valor"
- tapOn:
    id: "goal-add-value"
- eraseText
- inputText: "5000"
- tapOn:
    point: "50%,4%"
- assertVisible: ".*Conta Principal.*"
- tapOn: "Adicionar"
- extendedWaitUntil:
    visible: ".*50,00.*de.*1.000,00"
    timeout: 15000
# O card arredonda o progresso para inteiro (`formatPercent(progresso, 0)`):
# mostra "5%", nunca "5,0%". E o bloco de informação é um nó só, então a regex
# precisa cobrir o texto inteiro.
- assertVisible: ".*Meta Smoke, 5%.*"
- takeScreenshot: "04-meta-reservada"
- tapOn:
    point: "89%,92%"
- tapOn: "Contas"
# Cards de conta são compostos: regex parcial, nunca igualdade total
- extendedWaitUntil:
    visible: ".*Cofre: Meta Smoke.*"
    timeout: 15000
# O saldo mora no mesmo nó do cofre, que termina em "Somente leitura ·
# gerenciada no módulo de origem" — `.*50,00` exigiria que o texto acabasse no
# valor. Amarrar o valor ao cofre também evita casar com outro card qualquer.
- assertVisible: ".*Cofre: Meta Smoke.*50,00.*"

# Extrato confiavel da conta principal
# O card da conta é composto: o rótulo do nó funde nome, subtipo, saldo e banco,
# e o Maestro casa regex por igualdade total. Antes havia um rótulo curado, que
# escondia saldo e subtipo do leitor de tela.
- tapOn: ".*Conta Principal.*"
- extendedWaitUntil:
    visible: "Saldo conferido"
    timeout: 15000
- assertVisible: ".*Ledger.*"
- takeScreenshot: "05-extrato-reconciliado"
- tapOn: "Fechar"

# Relatorios atualizados com as duas despesas (100 + 75)
# "Voltar" aqui não leva ao hub de Ajustes: a pilha do `more` ainda tem a fatura
# embaixo de Contas, então o pop volta para a fatura e o tile "Relatórios" não
# está em tela. A aba Análises abre a mesma tela direto — e, como os rótulos da
# tab bar nativa não entram na árvore de acessibilidade, o toque é por coordenada.
- tapOn:
    point: "30%,92%"
- extendedWaitUntil:
    visible: "Relatórios"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Gastos por categoria"
    direction: DOWN
- assertVisible: "Alimentação"
- assertVisible: ".*175,00"
- scrollUntilVisible:
    element:
      text: "Maiores despesas"
    direction: DOWN
- assertVisible: "Despesa smoke"
- assertVisible: "Compra cartão smoke"
- takeScreenshot: "06-relatorios"

# Guard rails de erros visiveis
- assertNotVisible: ".*Erro ao.*"
# As telas migradas escrevem "Não deu para carregar/gerar ..." no lugar de
# "Erro ao ...". Sem esta linha o guard-rail fica cego justamente nelas.
- assertNotVisible: ".*Não deu para.*"
- assertNotVisible: ".*Tente novamente.*"
- assertNotVisible: ".*Falha de integração.*"
- assertNotVisible: "Selecione um cartão."
- assertNotVisible: "Selecione uma categoria."
