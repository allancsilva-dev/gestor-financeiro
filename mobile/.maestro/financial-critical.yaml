appId: com.gestorfinanceiro.mobile
name: Financial critical (local disposable environment)
tags:
  - financial-critical
---
- launchApp:
    clearState: true

# Registro descartavel e consentimento LGPD
- tapOn: ".*Criar conta"
- tapOn:
    id: "register-name"
- inputText: "Smoke Financeiro"
- tapOn:
    id: "register-email"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "register-password"
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: "register-confirm-password"
- inputText: ${E2E_PASSWORD}
- pressKey: Enter
- tapOn: "Aceito a política de privacidade"
- tapOn:
    id: "register-submit"
- extendedWaitUntil:
    visible: "Sua conta principal"
    timeout: 20000

# Onboarding minimo (PR-F3-09): etapa unica, so conta principal com 1.000
- assertVisible: "Sua conta principal"
- tapOn:
    id: "onboarding-account-balance"
- inputText: "100000"
- hideKeyboard
- tapOn: "Começar"
- extendedWaitUntil:
    visible: "Início"
    timeout: 20000
- takeScreenshot: "01-onboarding-completo"

# Setup pos-onboarding pelas telas: cartao, categoria e meta (nao criados no onboarding minimo)
- tapOn: "Mais"
- tapOn: "Categorias"
- tapOn: "Nova categoria"
- tapOn:
    id: "category-name"
- inputText: "Alimentação"
- hideKeyboard
- tapOn: "Salvar"
- extendedWaitUntil:
    visible: "Alimentação"
    timeout: 15000
- tapOn: "Voltar"
- tapOn: "Cartões"
- tapOn: "Novo cartão"
- tapOn: "Nome da conta"
- inputText: "Cartão Principal"
- tapOn: "Limite total"
- inputText: "500000"
- tapOn: "Dia de fechamento"
- inputText: "5"
- tapOn: "Dia de vencimento"
- inputText: "12"
- hideKeyboard
- tapOn: "Salvar"
- extendedWaitUntil:
    visible: "Cartão Principal"
    timeout: 15000
- tapOn: "Voltar"
- tapOn: "Planejamento"
- tapOn: "Criar meta"
- tapOn: "Cofre real.*"
- tapOn:
    id: "goal-name"
- inputText: "Meta Smoke"
- tapOn:
    id: "goal-total"
- inputText: "100000"
- hideKeyboard
- tapOn: "Salvar"
- extendedWaitUntil:
    visible: "Meta Smoke"
    timeout: 15000
- tapOn: "Início"

# Despesa de R$ 100 na conta principal
- tapOn: "Nova transação"
- assertVisible: "Nova Transação"
- tapOn:
    id: "transaction-value"
- inputText: "10000"
- tapOn:
    id: "transaction-description"
- inputText: "Despesa smoke"
- tapOn:
    id: "transaction-date"
- eraseText
- inputText: ${E2E_DATE_INPUT}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: ".*Alimentação"
    direction: DOWN
- tapOn: ".*Alimentação"
- assertVisible: "Conta Principal"
- tapOn: "Salvar"
- extendedWaitUntil:
    visible: "Despesa smoke"
    timeout: 15000
- assertVisible: ".*100,00"
- tapOn: "Início"
- scrollUntilVisible:
    element:
      text: "Despesa smoke"
    direction: DOWN
- takeScreenshot: "02-despesa-dashboard"

# Compra de R$ 75 no cartao
- tapOn: "Nova transação"
- tapOn:
    id: "transaction-value"
- inputText: "7500"
- tapOn:
    id: "transaction-description"
- inputText: "Compra cartão smoke"
- tapOn:
    id: "transaction-date"
- eraseText
- inputText: ${E2E_DATE_INPUT}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: ".*Alimentação"
    direction: DOWN
- tapOn: ".*Alimentação"
- scrollUntilVisible:
    element:
      text: "Cartão"
    direction: DOWN
- tapOn: "Cartão"
- assertVisible: "Cartão Principal"
- tapOn: "Salvar"
- extendedWaitUntil:
    visible: "Compra cartão smoke"
    timeout: 15000

# Fatura: lancamento 75, pagamento parcial 25 e restante 50
- tapOn: "Mais"
- tapOn: "Cartão"
- extendedWaitUntil:
    visible: "Faturas"
    timeout: 15000
- assertVisible: ".*75,00"
- scrollUntilVisible:
    element:
      text: "Compra cartão smoke"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Valor do pagamento"
    direction: UP
- tapOn:
    id: "invoice-payment-value"
- eraseText
- inputText: "2500"
- hideKeyboard
- tapOn: "Pagar Fatura"
- extendedWaitUntil:
    visible: ".*Restante:.*50,00"
    timeout: 15000
- assertVisible: ".*Pago:.*25,00"
- takeScreenshot: "03-fatura-parcial"

# Reserva de R$ 50 na meta e verificacao do cofre
- tapOn: "Planejamento"
- extendedWaitUntil:
    visible: "Meta Smoke"
    timeout: 15000
- tapOn: "Adicionar valor à meta Meta Smoke"
- assertVisible: "Adicionar Valor"
- tapOn:
    id: "goal-add-value"
- eraseText
- inputText: "5000"
- hideKeyboard
- assertVisible: ".*Conta Principal.*"
- tapOn: "Adicionar"
- extendedWaitUntil:
    visible: ".*50,00.*de.*1.000,00"
    timeout: 15000
- assertVisible: "5,0%"
- takeScreenshot: "04-meta-reservada"
- tapOn: "Mais"
- tapOn: "Contas"
- extendedWaitUntil:
    visible: "Cofre: Meta Smoke"
    timeout: 15000
- assertVisible: ".*50,00"

# Extrato confiavel da conta principal
- tapOn: "Ver extrato da conta Conta Principal"
- extendedWaitUntil:
    visible: "Saldo reconciliado com o ledger"
    timeout: 15000
- assertVisible: "Saldo conferido"
- takeScreenshot: "05-extrato-reconciliado"
- tapOn: "Fechar"

# Relatorios atualizados com as duas despesas (100 + 75)
- tapOn: "Voltar"
- tapOn: "Relatórios"
- extendedWaitUntil:
    visible: "Relatórios"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Gastos por categoria"
    direction: DOWN
- assertVisible: "Alimentação"
- assertVisible: ".*175,00"
- scrollUntilVisible:
    element:
      text: "Maiores despesas"
    direction: DOWN
- assertVisible: "Despesa smoke"
- assertVisible: "Compra cartão smoke"
- takeScreenshot: "06-relatorios"

# Guard rails de erros visiveis
- assertNotVisible: ".*Erro ao.*"
- assertNotVisible: ".*Tente novamente.*"
- assertNotVisible: ".*Falha de integração.*"
