appId: com.gestorfinanceiro.mobile
tags:
  - smoke
  - privacy
---
- launchApp:
    clearState: true
- tapOn: ".*Criar conta"
# O aceite fica no ultimo passo: identidade -> senha -> privacidade
- tapOn:
    id: "register-name"
- inputText: "Consent Smoke"
- tapOn:
    id: "register-email"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "register-continuar"
- tapOn:
    id: "register-password"
- waitForAnimationToEnd
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: "register-confirm-password"
- waitForAnimationToEnd
- inputText: ${E2E_PASSWORD}
- pressKey: Enter
- tapOn:
    id: "register-continuar"
- assertVisible: "Aceito a política de privacidade"
- tapOn: "política de privacidade"
- assertVisible: "Política de privacidade"
- assertVisible: "Versão 2026-07 · Gestor Financeiro"
- scrollUntilVisible:
    element:
      text: "Seus direitos"
    direction: DOWN
- assertVisible: "Seus direitos"
- scrollUntilVisible:
    element:
      text: "Voltar"
    direction: UP
- tapOn: "Voltar"
- assertVisible: "Aceito a política de privacidade"
