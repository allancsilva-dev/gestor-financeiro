appId: com.gestorfinanceiro.mobile
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible: "Gestor Financeiro"
- tapOn: "E-mail"
- inputText: ${E2E_EMAIL}
- tapOn: "Senha"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "Entrar"
# A tab bar virou painel nativo (react-native-screens) e os rótulos das abas não
# aparecem na árvore de acessibilidade — a asserção é pelo conteúdo da Home.
- assertVisible: "Saldo Disponível"
