appId: com.gestorfinanceiro.mobile
name: Assistente — compra parcelada no cartão
tags:
  - assistant
  - financial-critical
---
# Parcelar é privilégio do cartão: a revisão precisa chegar com o cartão escolhido e as
# parcelas que a pessoa falou, sem ela redigitar nada.
- launchApp:
    clearState: true
- tapOn:
    id: "login-email"
- inputText: ${E2E_EMAIL}
- pressKey: Enter
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Saldo Disponível"
    timeout: 20000
- tapOn:
    point: "89%,92%"
- scrollUntilVisible:
    element:
      text: "Assistente"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "Assistente"
- tapOn:
    id: "assistant-message"
- inputText: "comprei 899,90 de gasolina no posto ontem no Cartao Nubank em 3x"
- tapOn:
    point: "50%,18%"
- tapOn:
    id: "assistant-send"
- extendedWaitUntil:
    visible: "Revisar lançamento"
    timeout: 15000
- assertVisible: "Rascunho preparado pelo Assistente.*"
- assertVisible:
    id: "transaction-value"
# O parcelamento vive em "Mais detalhes": abrir prova que veio preenchido do rascunho.
- scrollUntilVisible:
    element:
      id: "more-details-toggle"
    direction: DOWN
- tapOn:
    id: "more-details-toggle"
- waitForAnimationToEnd
- assertVisible: "Parcelamento"
- scrollUntilVisible:
    element:
      id: "transaction-installments"
    direction: DOWN
- assertVisible:
    id: "transaction-installments"
    text: "3"
- scrollUntilVisible:
    element:
      id: "transaction-save"
    direction: DOWN
- tapOn:
    id: "transaction-save"
- extendedWaitUntil:
    visible: "Transações"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Gasolina.*"
    timeout: 15000
