appId: com.gestorfinanceiro.mobile
name: Assistente — áudio, transcript e confirmação
tags:
  - assistant
  - audio
  - financial-critical
---
# Executar em aparelho/simulador com microfone liberado e transcrição fake determinística.
- launchApp:
    clearState: true
- tapOn:
    id: "login-email"
- inputText: ${E2E_EMAIL}
- pressKey: Enter
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Saldo Disponível"
    timeout: 20000
- tapOn:
    point: "89%,92%"
- tapOn: "Assistente"
- tapOn:
    id: "assistant-audio"
- waitForAnimationToEnd
- assertVisible: "Parar gravação.*"
- tapOn:
    id: "assistant-audio"
- extendedWaitUntil:
    visible: "gasolina 85 hoje"
    timeout: 45000
- extendedWaitUntil:
    visible: "Revisar lançamento"
    timeout: 5000
- assertVisible: "Rascunho preparado pelo Assistente.*"
- tapOn:
    id: "transaction-save"
- extendedWaitUntil:
    visible: "Transações"
    timeout: 20000
